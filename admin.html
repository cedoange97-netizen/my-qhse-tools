<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My-QHSE Tools – Administration</title>
<style>
  :root { --vert:#1b7f4b; --vert-clair:#e8f5ee; --texte:#1c2a22; --fond:#ffffff; --bord:#cfe3d7; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --vert:#4cc785; --vert-clair:#17261e; --texte:#e6f0ea; --fond:#0f1713; --bord:#2a3d32; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; color:var(--texte); background:var(--fond); padding:12px; max-width:900px; margin-inline:auto; }
  h1 { font-size:1.3rem; color:var(--vert); margin:.2rem 0 .8rem; }
  h2 { font-size:1.05rem; margin:1.4rem 0 .5rem; color:var(--vert); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 200px; padding:12px; font-size:1rem; border:1px solid var(--bord); border-radius:8px; background:var(--fond); color:var(--texte); }
  button { padding:12px 16px; font-size:1rem; border:0; border-radius:8px; background:var(--vert); color:#fff; font-weight:600; }
  button.sec { background:var(--vert-clair); color:var(--vert); border:1px solid var(--bord); }
  #msg { margin:.6rem 0; min-height:1.4em; } #msg.err { color:var(--err); font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .kpi { background:var(--vert-clair); border:1px solid var(--bord); border-radius:10px; padding:10px; }
  .kpi b { display:block; font-size:1.5rem; color:var(--vert); } .kpi span { font-size:.85rem; }
  .wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--bord); white-space:nowrap; } th { background:var(--vert-clair); }
  .barre { height:10px; background:var(--vert); border-radius:5px; min-width:2px; }
  .jour { display:grid; grid-template-columns:5.5rem 1fr 3rem; gap:8px; align-items:center; font-size:.85rem; margin:3px 0; }
  .cache { display:none; }
  @media (min-width:600px) { .kpis { grid-template-columns:repeat(4,1fr); } }
</style>
</head>
<body>
<h1>My-QHSE Tools – Administration</h1>
<form id="login" autocomplete="on">
  <input id="jeton" type="password" autocomplete="current-password" placeholder="Jeton administrateur" aria-label="Jeton administrateur" required>
  <button type="submit">Afficher</button>
</form>
<p id="msg" role="status" aria-live="polite">Saisissez votre jeton. Il n'est ni enregistré ni affiché.</p>

<div id="tableau" class="cache">
  <div class="kpis" id="kpis"></div>
  <h2>Par thème</h2><div class="wrap"><table id="themes"></table></div>
  <h2>30 derniers jours</h2><div id="jours"></div>
  <h2>Dernières tentatives</h2><div class="wrap"><table id="tentatives"></table></div>
  <p><button class="sec" id="plus" type="button">Voir plus de résultats</button></p>
  <p><button class="sec" id="rafraichir" type="button">Actualiser</button> <button class="sec" id="quitter" type="button">Verrouiller</button></p>
</div>

<script>
(function () {
  "use strict";
  var API = "https://my-qhse-api-ci.cedoange97.workers.dev";
  var PAGE = 50, decalage = 0;
  var jeton = ""; // en mémoire uniquement : disparaît à la fermeture de la page
  var $ = function (id) { return document.getElementById(id); };

  function msg(t, err) { var m = $("msg"); m.textContent = t; m.className = err ? "err" : ""; }
  function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = String(text); if (cls) e.className = cls; return e; }
  function nb(v, suffixe) { return (v === null || v === undefined) ? "–" : v + (suffixe || ""); }
  function duree(s) { if (s === null || s === undefined) return "–"; return s >= 60 ? Math.floor(s / 60) + " min " + (s % 60) + " s" : s + " s"; }

  function appel(chemin) {
    return fetch(API + chemin, { headers: { "Authorization": "Bearer " + jeton } }).then(function (r) {
      if (r.status === 401) throw new Error("Jeton invalide.");
      if (r.status === 429) throw new Error("Trop de requêtes. Réessayez dans quelques minutes.");
      if (r.status === 503) throw new Error("Administration non configurée côté serveur (secret ADMIN_TOKEN manquant).");
      if (!r.ok) throw new Error("Erreur du serveur (" + r.status + ").");
      return r.json();
    });
  }

  function tableau(id, entetes, lignes) {
    var t = $(id); t.textContent = "";
    var h = el("tr"); entetes.forEach(function (x) { h.appendChild(el("th", x)); }); t.appendChild(h);
    if (!lignes.length) { var v = el("tr"); var c = el("td", "Aucune donnée"); c.colSpan = entetes.length; v.appendChild(c); t.appendChild(v); }
    lignes.forEach(function (l) { var tr = el("tr"); l.forEach(function (x) { tr.appendChild(el("td", x)); }); t.appendChild(tr); });
  }

  function lignesTentatives(liste) {
    return (liste.attempts || []).map(function (a) {
      return [a.created_at, a.theme, a.score + " / " + a.total, nb(a.correct_count), nb(a.wrong_count), duree(a.duration_seconds), a.participant_id ? a.participant_id.slice(0, 6) : "–"];
    });
  }

  function plus() {
    msg("Chargement…");
    appel("/api/admin/attempts?limit=" + PAGE + "&offset=" + decalage).then(function (liste) {
      var t = $("tentatives");
      lignesTentatives(liste).forEach(function (l) { var tr = el("tr"); l.forEach(function (x) { tr.appendChild(el("td", x)); }); t.appendChild(tr); });
      decalage += (liste.attempts || []).length;
      if ((liste.attempts || []).length < PAGE) $("plus").className = "cache";
      msg("Données à jour.");
    }).catch(function (e) { msg(e.message === "Failed to fetch" ? "Réseau indisponible." : e.message, true); });
  }

  function afficher(stats, liste) {
    var t = stats.totals || {}, k = $("kpis"); k.textContent = "";
    [["Tentatives", nb(t.attempts)], ["Participants", nb(t.participants)], ["Score moyen", nb(t.avg_percent, " %")], ["Durée moyenne", duree(t.avg_duration_s)]]
      .forEach(function (x) { var d = el("div", null, "kpi"); d.appendChild(el("b", x[1])); d.appendChild(el("span", x[0])); k.appendChild(d); });

    tableau("themes", ["Thème", "Tentatives", "Score moyen"], (stats.byTheme || []).map(function (r) { return [r.theme, r.attempts, nb(r.avg_percent, " %")]; }));

    var j = $("jours"); j.textContent = "";
    var jours = stats.last30Days || [], max = Math.max.apply(null, [1].concat(jours.map(function (d) { return d.attempts; })));
    if (!jours.length) j.appendChild(el("p", "Aucune tentative sur les 30 derniers jours."));
    jours.forEach(function (d) {
      var l = el("div", null, "jour"); l.appendChild(el("span", d.day));
      var b = el("div", null, "barre"); b.style.width = Math.max(2, Math.round(d.attempts / max * 100)) + "%"; l.appendChild(b);
      l.appendChild(el("span", d.attempts)); j.appendChild(l);
    });

    tableau("tentatives", ["Date (UTC)", "Thème", "Score", "Bonnes", "Mauvaises", "Durée", "Participant"], lignesTentatives(liste));
    decalage = (liste.attempts || []).length;
    $("plus").className = decalage < PAGE ? "cache" : "sec";
    $("tableau").className = "";
  }

  function charger() {
    msg("Chargement…");
    return Promise.all([appel("/api/admin/stats"), appel("/api/admin/attempts?limit=" + PAGE)])
      .then(function (r) { afficher(r[0], r[1]); msg("Données à jour."); })
      .catch(function (e) { $("tableau").className = "cache"; msg(e.message === "Failed to fetch" ? "Réseau indisponible." : e.message, true); });
  }

  $("login").addEventListener("submit", function (e) { e.preventDefault(); jeton = $("jeton").value.trim(); if (jeton) charger(); });
  $("rafraichir").addEventListener("click", charger);
  $("plus").addEventListener("click", plus);
  $("quitter").addEventListener("click", function () { jeton = ""; $("jeton").value = ""; $("tableau").className = "cache"; msg("Verrouillé."); });
})();
</script>
</body>
</html>
